name: Test KT3 analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile application
        run: |
          python -m py_compile app.py
          python -m py_compile analysis_core.py
          python -m py_compile advanced_analysis.py
          python -m py_compile large_data_core.py
          python -m py_compile nd2_large_source.py
          python -m py_compile main_ui.py
          python -m py_compile pages/2_Advanced_Response_Analysis.py
          python -m py_compile pages/3_Large_Dataset_Whole_Array.py
          python -m py_compile pages/4_Nikon_ND2_Whole_Array.py

      - name: Run automated test suite
        run: pytest -q tests
